  utility: src.app.api.v1.routes.utility
  uuid: uuid

functions:
  __init__:
    type: sync
    module: services.backend.src.agents.agent_factory
    args: [self]
  _create_and_log_user_event:
    type: async
    module: services.backend.src.app.services.agent_service
    args: [self, session_service, session, query_text, model_name]
    params:
      returns: genai_types.Content
  _extract_mermaid:
    type: sync
    module: services.backend.src.agents.tools
    args: [text]
    params:
      returns: str
  _fallback_mermaid:
    type: sync
    module: services.backend.src.agents.tools
    args: [description]
    params:
      returns: str
  _get_genai_client:
    type: sync
    module: services.backend.src.agents.tools
    params:
      returns: Optional[Any]
  _platform_appendix:
    type: sync
    module: services.backend.src.agents.system_instructions
    args: [platform]
    params:
      returns: str
  _process_agent_events:
    type: async
    module: services.backend.src.app.services.agent_service
    args: [self, request, session_service, runner, session, config, user_content, model_name]
    params:
      returns: Tuple
  _process_uploaded_files:
    type: async
    module: services.backend.src.app.services.agent_service
    args: [self, request, session, file_artifacts]
    params:
      returns: str
  _sanitize_mermaid:
    type: sync
    module: services.backend.src.agents.tools
    args: [code]
    params:
      returns: str
  _save_file_as_artifact:
    type: async
    module: services.backend.src.app.api.v1.routes.agent
    args: [request, file, config]
    params:
      returns: str
  agent_endpoint:
    type: async
    module: services.backend.src.app.api.v1.routes.agent
    args: [request, response, config, text, model, files, platform]
    params:
      returns: AgentResponse
  auth_status:
    type: async
    module: services.backend.src.app.api.v1.routes.auth
    args: [session]
    params:
      returns: dict
  before_model_callback:
    type: sync
    module: services.backend.src.agents.callbacks
    args: [callback_context, llm_request]
    params:
      returns: Optional[LlmResponse]
  clear_cache:
    type: sync
    module: services.backend.src.agents.agent_factory
    args: [self]
    params:
      returns: None
  configure_gcp_environment:
    type: sync
    module: services.backend.src.app.main
    params:
      returns: None
  edit_mermaid_diagram:
    type: async
    module: services.backend.src.app.api.v1.routes.mermaid_edit
    args: [request, service]
    params:
      returns: MermaidEditResponse
  generate_architecture_diagram:
    type: sync
    module: services.backend.src.agents.tools
    args: [description, platform]
    params:
      returns: Dict
  get_agent:
    type: sync
    module: services.backend.src.agents.agent_factory
    args: [self, model_name, platform]
    params:
      returns: Agent
  get_agent_config:
    type: sync
    module: services.backend.src.app.utils.dependencies
    params:
      returns: AgentConfig
  get_available_models:
    type: sync
    module: services.backend.src.agents.agent_factory
    args: [self]
    params:
      returns: Dict
  get_default_model:
    type: sync
    module: services.backend.src.agents.agent_factory
    args: [self]
    params:
      returns: str
  get_diagram_generator_instructions:
    type: sync
    module: services.backend.src.agents.system_instructions
    args: [platform]
    params:
      returns: str
  get_general_assistant_instructions:
    type: sync
    module: services.backend.src.agents.system_instructions
    params:
      returns: str
  get_mermaid_edit_service:
    type: sync
    module: services.backend.src.app.utils.dependencies
    params:
      returns: MermaidEditService
  get_or_create_session:
    type: async
    module: services.backend.src.app.utils.dependencies
    args: [request, response, config]
    params:
      returns: Session
  get_platform_assistant_instructions:
    type: sync
    module: services.backend.src.agents.system_instructions
    args: [platform]
    params:
      returns: str
  get_runner:
    type: sync
    module: services.backend.src.app.utils.dependencies
    args: [request, config, model_name, platform]
    params:
      returns: Runner
  get_session_model:
    type: async
    module: services.backend.src.app.utils.dependencies
    args: [request]
    params:
      returns: str
  get_session_platform:
    type: async
    module: services.backend.src.app.utils.dependencies
    args: [request]
    params:
      returns: str
  get_session_service:
    type: sync
    module: services.backend.src.app.utils.dependencies
    args: [request]
    params:
      returns: InMemorySessionService
  is_model_supported:
    type: sync
    module: services.backend.src.agents.agent_factory
    args: [self, model_name]
    params:
      returns: bool
  lifespan:
    type: async
    module: services.backend.src.app.main
    args: [app]
  login:
    type: async
    module: services.backend.src.app.api.v1.routes.auth
    args: [login_data, request, response, session]
    params:
      returns: LoginResponse
  logout:
    type: async
    module: services.backend.src.app.api.v1.routes.auth
    args: [session]
    params:
      returns: LogoutResponse
  process_query:
    type: async
    module: services.backend.src.app.services.agent_service
    args: [self, request, query, config, session, runner, model_name]
    params:
      returns: AgentResponse
  sse_endpoint:
    type: async
    module: services.backend.src.app.api.v1.routes.agent
    args: [session_id]
    params:
      returns: StreamingResponse
  store_tool_result_callback:
    type: sync
    module: services.backend.src.agents.callbacks
    args: [tool, args, tool_context, tool_response]
    params:
      returns: Optional[Dict]

variables:
  GOOGLE_API_KEY:
    type: env
    params:
      caller: [os.getenv]
      path: [services.backend.src.agents.tools]
  GOOGLE_CLOUD_LOCATION:
    type: env
    params:
      caller: [os.environ]
  GOOGLE_CLOUD_PROJECT:
    type: env
    params:
      caller: [os.environ]
