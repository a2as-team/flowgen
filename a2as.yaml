manifest:
  version: "0.1.3"
  schema: https://a2as.org/cert/schema
  subject:
    name: justmeloic/flowgen
    source: https://github.com/justmeloic/flowgen
    branch: main
    commit: "c4c7dc51"
    scope: [services/backend/src/agents/agent_factory.py, services/backend/src/agents/callbacks.py, services/backend/src/agents/system_instructions.py,
      services/backend/src/agents/tools.py, services/backend/src/app/api/v1/endpoints.py, services/backend/src/app/api/v1/routes/agent.py,
      services/backend/src/app/services/agent_service.py, services/backend/src/app/utils/dependencies.py]
  issued:
    by: A2AS.org
    at: '2026-02-11T16:56:08Z'
    url: https://a2as.org/certified/agents/justmeloic/flowgen
  signatures:
    digest: sha256:Zu6JwjVI1YlI6rnHIS3rfQnhnMVRKYf5_QYU3w9SEos
    key: ed25519:KeMwoN-dxcE33OeG6tGysaFqfeDn3XjQFxaMpeTBfGo
    sig: ed25519:V-KHG_0IX6jrqQF9IpuAcM8M21-TDuCr0rmfVkfiVEC3azOeVbuFnS_ySz2Y2s-j7jlzfq_SjmURzd4lgpb_Aw

agents:
  agent:
    type: instance
    models: [model_name]
    params:
      name: assistant_{model_name.replace.replace}__{platform}
      description: AI assistant using {model_config[display_name]} - {model_config[description]} with diagram generation
      instruction: get_platform_assistant_instructions(general)
      after_tool_callback: store_tool_result_callback
      before_model_callback: before_model_callback
      function: get_agent

models:
  model_name:
    type: literal
    agents: [agent]

imports:
  _logger: loguru.logger
  agent: src.app.api.v1.routes.agent
  Agent: google.adk.agents.Agent
  agent_factory: agent_factory.agent_factory
  agent_service: agent_service.agent_service
  AgentConfig: src.app.models.AgentConfig
  AgentResponse: src.app.schemas.AgentResponse
  AgentService: agent_service.AgentService
  Annotated: typing.Annotated
  annotations: __future__.annotations
  Any: typing.Any
  APIRouter: fastapi.APIRouter
  asynccontextmanager: contextlib.asynccontextmanager
  auth: src.app.api.v1.routes.auth
  BaseTool: google.adk.tools.base_tool.BaseTool
  before_model_callback: callbacks.before_model_callback
  bugs: src.app.api.v1.routes.bugs
  CallbackContext: google.adk.agents.callback_context.CallbackContext
  Content: google.genai.types.Content
  CORSMiddleware: fastapi.middleware.cors.CORSMiddleware
  create_fallback_mermaid: src.lib.mermaid_utils.create_fallback_mermaid
  Depends: fastapi.Depends
  Dict: typing.Dict
  Event: google.adk.events.Event
  EventActions: google.adk.events.EventActions
  extract_mermaid: src.lib.mermaid_utils.extract_mermaid
  FastAPI: fastapi.FastAPI
  File: fastapi.File
  files: src.app.api.v1.routes.files
  FileValidator: src.app.artifacts.file_validator.FileValidator
  Form: fastapi.Form
  format_text_response: src.app.utils.formatters.format_text_response
  FunctionTool: google.adk.tools.FunctionTool
  genai: google.genai
  genai_types: google.genai.types
  generate_architecture_diagram: tools.generate_architecture_diagram
  get_agent_config: src.app.utils.dependencies.get_agent_config
  get_diagram_generator_instructions: system_instructions.get_diagram_generator_instructions
  get_file_processor: src.app.artifacts.file_processors.get_file_processor
  get_mermaid_edit_service: src.app.utils.dependencies.get_mermaid_edit_service
  get_or_create_session: src.app.utils.dependencies.get_or_create_session
  get_platform_assistant_instructions: system_instructions.get_platform_assistant_instructions
  get_runner: src.app.utils.dependencies.get_runner
  get_session_model: src.app.utils.dependencies.get_session_model
  get_session_platform: src.app.utils.dependencies.get_session_platform
  HTTPException: fastapi.HTTPException
  InMemoryArtifactService: google.adk.artifacts.InMemoryArtifactService
  InMemorySessionService: google.adk.sessions.InMemorySessionService
  json: json
  List: typing.List
  LlmResponse: google.adk.models.llm_response.LlmResponse
  load_dotenv: dotenv.load_dotenv
  logger: loguru.logger
  logging: logging
  LoginRequest: src.app.models.login.LoginRequest
  LoginResponse: src.app.models.login.LoginResponse
  LogoutResponse: src.app.models.login.LogoutResponse
  lru_cache: functools.lru_cache
  main_v1_router: src.app.api.v1.endpoints.main_v1_router
  mermaid_edit: src.app.api.v1.routes.mermaid_edit
